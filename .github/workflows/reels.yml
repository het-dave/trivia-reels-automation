name: reels

# Only schedule + manual triggers: no pull_request / issues / fork events can ever run with the secrets.
on:
  schedule:
    - cron: "17 3,7,11,15 * * *" # 08:47, 12:47, 16:47, 20:47 IST = slots 1-4
  workflow_dispatch:
    inputs:
      mode:
        description: "dry_run = render only, MP4 uploaded as artifact (no posting). publish_test = publish one real reel now. check_ig = verify the Instagram token + account ID."
        type: choice
        options: [dry_run, publish_test, check_ig]
        default: dry_run
      force_piper:
        description: "Skip edge-tts and use the Piper fallback (to test it)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: reels
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MODE: ${{ github.event_name == 'schedule' && 'schedule' || inputs.mode }}
      GH_TOKEN: ${{ github.token }}
      PIPER_VOICE_DIR: /home/runner/.cache/piper
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Git identity + pre-commit secret scan for state commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config core.hooksPath .githooks
          echo "JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"   # time budget counts from job start (job timeout: 30 min)

      - name: Secret scan (all tracked files)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python3 scripts/secret_scan.py --all

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Gate (inactive slots exit here)
        id: gate
        if: env.MODE == 'schedule'
        run: |
          pip install -q "$(grep -i '^pyyaml' requirements.txt)"
          python -m trivia gate

      - name: Check Instagram token + account ID
        if: env.MODE == 'check_ig'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python3 -m trivia.instagram

      - name: Continue?
        id: go
        run: echo "go=${{ env.MODE != 'check_ig' && (env.MODE != 'schedule' || steps.gate.outputs.work == 'true') }}" >> "$GITHUB_OUTPUT"

      # ffmpeg/ffprobe: pinned, checksum-verified static build (FFmpeg 8.1, GitHub Releases) kept in the Actions cache,
      # so runs don't depend on Ubuntu mirrors. apt is only a fallback.
      - name: Cache ffmpeg
        if: steps.go.outputs.go == 'true'
        uses: actions/cache@v6
        with:
          path: /home/runner/.cache/ffmpeg
          key: ffmpeg-n8.1.3-27-g8dca1586f4-linux64-gpl

      - name: ffmpeg
        if: steps.go.outputs.go == 'true'
        timeout-minutes: 10
        env:
          FFMPEG_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-10-31-12-59/ffmpeg-n8.1.3-27-g8dca1586f4-linux64-gpl-8.1.tar.xz
          FFMPEG_SHA256: 41e9c565594c390622cf968d82fa4135d9e9a11d06c1515644288cbc844e3380
        run: |
          D=/home/runner/.cache/ffmpeg
          if [ ! -x "$D/ffmpeg" ]; then
            if curl -fsSL --retry 3 --max-time 300 -o /tmp/ff.tar.xz "$FFMPEG_URL" \
               && echo "$FFMPEG_SHA256  /tmp/ff.tar.xz" | sha256sum -c --quiet - \
               && mkdir -p "$D" && tar -xJf /tmp/ff.tar.xz -C "$D" --strip-components=2 --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'; then
              echo "ffmpeg: pinned static build downloaded"
            else
              rm -rf "$D"; echo "static ffmpeg unavailable, falling back to apt"; scripts/apt_install.sh ffmpeg
            fi
          fi
          if [ -x "$D/ffmpeg" ]; then echo "$D" >> "$GITHUB_PATH"; fi

      - name: Python deps + tests
        if: steps.go.outputs.go == 'true'
        run: |
          pip install -q -r requirements.txt
          python -m pytest -q tests

      - uses: actions/setup-node@v7
        if: steps.go.outputs.go == 'true'
        with:
          node-version: "22"

      - name: Cache node_modules (includes Remotion's Chrome Headless Shell)
        id: nm
        if: steps.go.outputs.go == 'true'
        uses: actions/cache@v6
        with:
          path: remotion/node_modules
          key: remotion-nm-${{ runner.os }}-${{ hashFiles('remotion/package-lock.json') }}

      - name: Remotion install + browser
        if: steps.go.outputs.go == 'true'
        working-directory: remotion
        run: |
          if [ "${{ steps.nm.outputs.cache-hit }}" != "true" ]; then npm ci --no-audit --no-fund; fi
          npx remotion browser ensure
          # Chrome Headless Shell's Linux libs (remotion.dev/docs/miscellaneous/linux-dependencies) ship with the
          # runner's preinstalled Google Chrome. Verify, and apt-install the documented list only if something's missing.
          CHS=$(find node_modules/.remotion -type f -name chrome-headless-shell | head -1)
          MISSING=$(ldd "$CHS" | grep "not found" || true)
          if [ -n "$MISSING" ]; then
            echo "missing Chrome libs:"; echo "$MISSING"
            ../scripts/apt_install.sh libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 \
              libxcomposite1 libxdamage1 libgbm-dev libcups2 libcairo2 libpango-1.0-0 libatk-bridge2.0-0
          else
            echo "Chrome Headless Shell libs: all present"
          fi

      - name: Cache Piper voice
        if: steps.go.outputs.go == 'true'
        uses: actions/cache@v6
        with:
          path: /home/runner/.cache/piper
          key: piper-en_US-ryan-high-v1

      - name: Piper voice + Claude CLI
        if: steps.go.outputs.go == 'true'
        run: |
          [ -f "$PIPER_VOICE_DIR/en_US-ryan-high.onnx" ] || python -m piper.download_voices en_US-ryan-high --data-dir "$PIPER_VOICE_DIR"
          npm install -g @anthropic-ai/claude-code --no-audit --no-fund
          claude --version

      - name: Generate, render, validate, publish
        id: run
        if: steps.go.outputs.go == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python -m trivia run --mode "$MODE" ${{ inputs.force_piper && '--force-piper' || '' }}

      - name: Upload dry-run reel
        if: always() && env.MODE == 'dry_run' && steps.go.outputs.go == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: dry-run-reel
          path: out/*.mp4
          retention-days: 7
          if-no-files-found: ignore

      # Python reports its own failures; this catches setup failures (apt, npm, pip, tests) before it ran.
      - name: Report setup failure
        if: failure() && steps.run.outcome != 'failure' && env.MODE != 'check_ig'
        run: python3 -m trivia.issues "workflow setup failed" "A step before the reel run failed (mode $MODE). See the run log."
