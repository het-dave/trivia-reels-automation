# Trivia Reels Automation config. Everything here is public: never put secrets in this file.
# Top-level keys are shared defaults; each entry under `accounts` overrides them for that Instagram account.

timezone: Asia/Kolkata

# One entry per Instagram account (same handle + secret_suffix must be in the matrix of .github/workflows/reels.yml;
# tests/test_accounts.py checks they match). Secrets: IG_USER_ID<suffix>, IG_ACCESS_TOKEN<suffix> (the token falls back to
# plain IG_ACCESS_TOKEN when a token covers several accounts).
# start_date = day 1 of the ramp. null = scheduled posting is OFF for that account (its runs exit in seconds).
# Slot N is due from slot_times_ist[N-1]. The workflow wakes every 30 min (cron "17,47 * * * *" UTC, i.e. :17 and :47 IST),
# so keep slot times on :17 or :47 and a due slot is published at the next wake. Accounts are staggered 1 h apart.
# topic_shift rotates the topic order so each account starts on a different topic.
accounts:
  - {handle: trivia_quiz_master, secret_suffix: "", start_date: 2026-11-06, slot_times_ist: ["08:47", "12:47", "16:47", "20:47"], topic_shift: 0}
  - {handle: triviaquizmaster, secret_suffix: "_2", start_date: 2026-11-07, slot_times_ist: ["09:47", "13:47", "17:47", "21:47"], topic_shift: 3}
  - {handle: trivia.quiz.master, secret_suffix: "_3", start_date: null, slot_times_ist: ["10:47", "14:47", "18:47", "22:47"], topic_shift: 6}

# Add steps to ramp up gradually, e.g. [{from_day: 1, slots: [2, 4]}, {from_day: 15, slots: [1, 2, 3, 4]}].
ramp:
  - {from_day: 1, slots: [1, 2, 3, 4]} # 4 reels/day from day 1
max_reels_per_day: 4
# A run starts another reel (catch-up + current) only if this many minutes remain in its budget.
run_budget_minutes: 26
reel_minutes_estimate: 11

# Least-recently-used rotation. With 10 topics a repeat inside 7 days is unavoidable
# at 2+ reels/day; LRU keeps repeats as far apart as possible.
topics:
  Geography:  {bg1: "#1B0B3A", bg2: "#0E4D5C", accent: "#2DD4BF"}
  Science:    {bg1: "#1B0B3A", bg2: "#0B3D6B", accent: "#38BDF8"}
  Movies:     {bg1: "#1F0A33", bg2: "#5C0F2E", accent: "#FB7185"}
  History:    {bg1: "#1E0B36", bg2: "#4A2A0E", accent: "#F59E0B"}
  Food:       {bg1: "#200A34", bg2: "#5A2A0A", accent: "#FB923C"}
  Sports:     {bg1: "#1B0B3A", bg2: "#0F4D2A", accent: "#4ADE80"}
  Space:      {bg1: "#0D0624", bg2: "#2A1066", accent: "#A78BFA"}
  Animals:    {bg1: "#1C0B38", bg2: "#3F4A0E", accent: "#A3E635"}
  Technology: {bg1: "#120A3A", bg2: "#0B2F6B", accent: "#60A5FA"}
  Music:      {bg1: "#1E0838", bg2: "#5B0E5E", accent: "#F472B6"}

questions:
  target: 10        # aim for this many
  min: 8            # never publish fewer
  candidates: 14    # generated before fact-check and dedupe

timer_seconds: 3
# Instagram's in-app Reel limit. Questions are dropped (never below min) to fit.
max_duration_seconds: 180

voice:
  edge: en-US-AndrewNeural
  piper: en_US-ryan-high
  edge_attempts: 4

claude:
  generate_model: sonnet
  factcheck_model: opus
  fallback_model: sonnet
  attempts: 3

mix:
  tick_db: -18
  ding_db: -21
  whoosh_db: -24
  music_db: -25
  music_duck_db: -9   # extra reduction under speech
  target_lufs: -14

render:
  crf: 20
  x264_preset: medium
  concurrency: null   # null = all CPU cores

instagram:
  graph_version: v27.0
  status_poll_seconds: 20
  status_timeout_seconds: 600

hashtags_common: ["trivia", "quiz", "triviaquiz", "quiztime", "generalknowledge", "funfacts", "brainteaser", "triviaquizmaster"]
